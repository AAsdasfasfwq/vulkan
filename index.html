<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" href="data:,">
    <title>Krakatoa 1883</title>
<style>
  html, body { margin: 0; height: 100%; background: #050505; color: #ddd; font: 13px/1.4 Inter, system-ui, sans-serif; overflow: hidden; }
  #stage { position: absolute; inset: 0 0 64px 0; display: flex; align-items: center; justify-content: center; }
  #out { max-width: 100%; max-height: 100%; aspect-ratio: 16 / 9; background: #000; box-shadow: 0 10px 60px rgba(0,0,0,.6); }
  #bar { position: absolute; left: 0; right: 0; bottom: 0; height: 64px; display: flex; gap: 12px; align-items: center; padding: 0 16px; background: #0d0d0f; border-top: 1px solid #222; }
  #bar button { background: #e2462a; color: #fff; border: 0; border-radius: 6px; padding: 8px 14px; font-weight: 600; cursor: pointer; }
  #seek { flex: 1; accent-color: #e2462a; }
  #info { min-width: 260px; text-align: right; font-variant-numeric: tabular-nums; opacity: .85; }
  #status { position: absolute; top: 12px; left: 16px; opacity: .7; }
  body.render #bar, body.render #status { display: none; }
  body.render #stage { inset: 0; }
</style>
</head>
<body>
<div id="stage"><canvas id="out" width="1920" height="1080"></canvas></div>
<div id="status">loading…</div>
<div id="bar">
  <button id="play">▶ Play</button>
  <input id="seek" type="range" min="0" max="1000" step="0.1" value="0" />
  <div id="info">0:00.0</div>
</div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
